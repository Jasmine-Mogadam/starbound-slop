app = "starbound-server"

kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "starbound_data"
  destination = "/opt/starbound/storage"

[vm]
  memory_mb = 1024

[[services]]
  protocol = "tcp"
  internal_port = 21025
  [[services.ports]]
    port = 21025

[[services]]
  protocol = "tcp"
  internal_port = 8080
  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
