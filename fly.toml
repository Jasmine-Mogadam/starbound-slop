app = "starbound-server"

kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "starbound_data"
  destination = "/opt/starbound/storage"

[vm]
  cpu_kind = "performance"
  cpus = 1
  memory_mb = 4096

[[services]]
  protocol = "tcp"
  internal_port = 21025
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[services.ports]]
    port = 21025
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[services]]
  protocol = "tcp"
  internal_port = 8080
  # auto_start = false: a browser hitting the status page must NOT wake the machine
  # (otherwise an open tab + meta-refresh loops wake/stop forever). Status page only
  # works when the machine is already awake from someone connecting to 21025.
  auto_stop_machines = "stop"
  auto_start_machines = false
  min_machines_running = 0
  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40
